[project]
name = "self-host-audio-llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "kokoro",
    "soundfile",
    "numpy",
    "httpx",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "silero-vad",
    "onnxruntime>=1.30.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "stripe>=15.6.1",
    "azure-storage-blob[aio]>=12.30.3",
    "kokoro-onnx>=0.6.1",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "sentry-sdk>=2.71.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "en-core-web-lg",
]

# torch comes in via kokoro/silero-vad. Pick one: cpu (CPU-only torch, ~4 GB smaller image)
# or gpu (CUDA torch + the cuBLAS/cuDNN libs ctranslate2 dlopen's)
[project.optional-dependencies]
cpu = ["torch"]
gpu = [
    "torch",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'linux'",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
