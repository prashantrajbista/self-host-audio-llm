[project]
name = "self-host-audio-llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "kokoro",
    "soundfile",
    "numpy",
    "httpx",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "silero-vad",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'linux'",
    "onnxruntime>=1.30.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "stripe>=15.6.1",
    "azure-storage-blob[aio]>=12.30.3",
    "kokoro-onnx>=0.6.1",
]

[tool.uv]
package = false
