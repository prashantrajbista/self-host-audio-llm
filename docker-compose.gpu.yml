# Rented GPU box only. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Swaps LLM leg from Ollama (CPU) to vLLM (GPU) — everything else (stt/tts/frontend) unchanged.
services:
  llm:
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}", "--dtype", "auto"]
    ports: !override
      - "8010:8000"
    volumes: !override
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    environment:
      LLM_BACKEND: vllm
      LLM_ENDPOINT: http://llm:8000
      LLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}

volumes:
  hf_cache:
