# Rented GPU box, vLLM leg only. Pulls the vllm/vllm-openai image. Usage:
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Swaps LLM leg from Ollama (CPU) to vLLM (GPU). Combine with docker-compose.gpu-audio.yml
# to also GPU-accelerate STT/TTS/VAD — they're independent, mix and match as needed.
services:
  llm:
    image: vllm/vllm-openai:latest
    # tool calling for the agent loop (hermes parser fits Qwen2.5; other model families need their own
    # parser); prefix caching reuses the stable system prompt + tool list across requests (lower TTFT)
    command: [
      "--model", "${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}", "--dtype", "auto",
      "--enable-auto-tool-choice", "--tool-call-parser", "hermes", "--enable-prefix-caching",
    ]
    ports: !override
      - "8010:8000"
    volumes: !override
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    environment:
      LLM_BACKEND: vllm
      LLM_ENDPOINT: http://llm:8000
      LLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}

volumes:
  hf_cache:
