# Rented GPU box, STT/TTS/VAD only — no vLLM/Ollama image pulled, LLM backend stays whatever
# docker-compose.yml/.env already picked (openai by default). Usage:
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.gpu-audio.yml up --build
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  gateway:
    environment:
      DEVICE: cuda
    <<: *gpu

  stt:
    environment:
      DEVICE: cuda
      # GPU has the headroom for a far more accurate model on noisy audio than CPU's small.en
      WHISPER_MODEL: ${WHISPER_MODEL_GPU:-large-v3-turbo}
    <<: *gpu

  tts:
    environment:
      DEVICE: cuda
    <<: *gpu
