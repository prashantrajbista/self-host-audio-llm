name: deploy

on:
  push:
    branches: [interview-coach]
  workflow_dispatch:

# never run two deploys against the VM at once
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      # self-check scripts that run on fakes (no models, no network)
      - run: |
          for t in test_store test_anonymize test_voice_anon test_interview test_agent test_markdown_strip test_session test_resume test_openai_audio test_silence test_monitoring; do
            uv run python -m tests.$t
          done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # env files live only on the VM (copied once by hand); excluded so --delete never touches them
      - name: Copy code
        run: rsync -az --delete --exclude '.env*' --exclude '.git' --exclude 'audios/' --exclude 'docs/' --exclude 'data/' ./ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/app/"
      - name: Build and restart
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd /opt/app && docker compose -f docker-compose.prod.yml up -d --build --remove-orphans && docker image prune -f"
