# readiness: each service's /health answers only once its models are loaded. The slim Python image has no
# curl, so probe with urllib. start_period covers first-boot model downloads.
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 300s

services:
  gateway:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: gateway
    ports:
      - "8000:8000"
    environment:
      STT_BACKEND: remote
      STT_ENDPOINT: http://stt:8001
      LLM_BACKEND: ${LLM_BACKEND:-openai}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-https://api.openai.com}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_FIRST_TOKEN_TIMEOUT: ${LLM_FIRST_TOKEN_TIMEOUT:-15}
      LLM_FALLBACK_ENDPOINT: ${LLM_FALLBACK_ENDPOINT:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      AGENT: ${AGENT:-assistant}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TTS_BACKEND: remote
      TTS_ENDPOINT: http://tts:8002
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.35}
      MAX_SESSIONS: ${MAX_SESSIONS:-50}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    depends_on:
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy

  stt:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: stt
    ports:
      - "8001:8001"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      STT_WORKERS: ${STT_WORKERS:-2}
      DEVICE: cpu
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  tts:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: tts
    ports:
      - "8002:8002"
    environment:
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      TTS_SPEED: ${TTS_SPEED:-1.15}
      TTS_WORKERS: ${TTS_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]

  # llm:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_WS_URL: ${NEXT_PUBLIC_GATEWAY_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "80:3000"
    depends_on:
      gateway:
        condition: service_healthy

